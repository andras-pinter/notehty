[package]
name = "notehty"
version = "1.0.0"
description = "Interactive, personal note taking and day flow organized App"
authors = ["Andras Pinter <andras@pinter.io>"]
edition = "2021"

[lib]
name = "lnotehty"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10" }
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.3", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
    "r2d2",
    "chrono",
    "uuid",
] }
diesel_migrations = "2.3"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
uuid = { version = "1.22", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
